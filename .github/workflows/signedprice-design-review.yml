name: SignedPrice design review

on:
  push:
    branches: [design/signedprice-site-refresh-20260918]
  pull_request:
    paths:
      - v2/apps/web/app/site-refresh.css
      - v2/apps/web/components/site-refresh/**
      - v2/tests/site-refresh*
      - .github/workflows/signedprice-design-review.yml

permissions:
  contents: read

concurrency:
  group: design-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked interface source for review
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('/tmp/signedprice-review-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  if not name or not name.startswith(('v2/', 'docs/', '.github/')):
                      continue
                  path = pathlib.Path(name)
                  if not path.is_file() or path.stat().st_size > 2000000:
                      continue
                  if '/public/' in name or '/data/' in name or '-snapshots/' in name:
                      continue
                  if path.suffix.lower() not in {'.ts', '.tsx', '.css', '.js', '.jsx', '.json', '.md', '.mjs', '.mts', '.cjs', '.yml', '.yaml', '.txt', '.svg'}:
                      continue
                  archive.add(path, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signedprice-review-source
          path: /tmp/signedprice-review-source.tar.gz
          retention-days: 3
