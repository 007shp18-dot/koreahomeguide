name: signedprice V2 CI

on:
  push:
    paths:
      - 'v2/**'
      - 'artifacts/public-p1/**'
      - 'artifacts/public-p2/**'
      - 'docs/operations/signedprice-public-p1-release-gate.md'
      - 'docs/operations/signedprice-singapore-release-gate.md'
      - 'artifacts/v2-migration/**'
      - 'scripts/v2-migration/**'
      - 'tests/**/*.test.cjs'
      - '.github/workflows/signedprice-v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - 'artifacts/public-p1/**'
      - 'artifacts/public-p2/**'
      - 'docs/operations/signedprice-public-p1-release-gate.md'
      - 'docs/operations/signedprice-singapore-release-gate.md'
      - 'artifacts/v2-migration/**'
      - 'scripts/v2-migration/**'
      - 'tests/**/*.test.cjs'
      - '.github/workflows/signedprice-v2-ci.yml'

permissions:
  contents: read

concurrency:
  group: signedprice-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify workbook QA mapping
        run: pnpm exec vitest run tests/public-p1-workbook-qa.test.ts
      - run: pnpm build
      - name: Confirm the temporary P2 generator is absent from the build
        run: pnpm exec vitest run tests/public-area-runner-absence.test.ts
      - name: Reject server-only Rent Check data from client assets
        run: pnpm check:rent-client-boundary
      - name: Reject server-only Singapore provider data from client assets
        run: pnpm check:singapore-client-boundary
      - name: Run full Phase 0 legacy gate
        working-directory: .
        run: node scripts/v2-migration/verify-phase-0.cjs

  mobile-journey:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install locked Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify mobile navigation and building round trip
        run: >-
          pnpm e2e --project=mobile-chromium --grep
          'Explore recovery keeps|mobile primary navigation|journey: Explore selection survives'
      - name: Upload mobile journey diagnostics
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: signedprice-v2-mobile-journey-diagnostics
          path: |
            v2/test-results
            v2/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install locked Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run wide, desktop and mobile workbook release gate
        run: pnpm e2e --project=desktop-chromium --project=mobile-chromium --project=tablet-chromium --project=wide-chromium
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: signedprice-v2-browser-diagnostics
          path: |
            v2/test-results
            v2/playwright-report
          if-no-files-found: ignore
          retention-days: 7
