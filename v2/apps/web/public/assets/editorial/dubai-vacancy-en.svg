<svg xmlns="http://www.w3.org/2000/svg" width="720" height="615" viewBox="0 0 720 615" role="img" aria-labelledby="title"><title id="title">Illustrative vacancy and first-year rental income</title><rect width="720" height="615" rx="16" fill="#f5f8fc"/><g font-family="Arial, 'Noto Sans KR', sans-serif"><text x="32" y="48" font-size="30" fill="#162235" font-weight="700" text-anchor="start">02 / The cost of an empty month</text><text x="32" y="91" font-size="25" fill="#162235" font-weight="400" text-anchor="start">Illustration · Same 12 months from today</text><text x="32" y="143" font-size="25" fill="#162235" font-weight="600" text-anchor="start">Immediate</text><rect x="32" y="155" width="480" height="30" rx="4" fill="#91a3bf"/><text x="527" y="180" font-size="26" fill="#162235" font-weight="700" text-anchor="start">120,000</text><text x="32" y="230" font-size="25" fill="#162235" font-weight="600" text-anchor="start">1 month vacant</text><rect x="32" y="242" width="440" height="30" rx="4" fill="#91a3bf"/><text x="487" y="267" font-size="26" fill="#162235" font-weight="700" text-anchor="start">110,000</text><text x="32" y="317" font-size="25" fill="#162235" font-weight="600" text-anchor="start">2 months vacant</text><rect x="32" y="329" width="400" height="30" rx="4" fill="#91a3bf"/><text x="447" y="354" font-size="26" fill="#162235" font-weight="700" text-anchor="start">100,000</text><text x="32" y="404" font-size="25" fill="#162235" font-weight="600" text-anchor="start">5% cut, immediate</text><rect x="32" y="416" width="456" height="30" rx="4" fill="#2161cd"/><text x="503" y="441" font-size="26" fill="#162235" font-weight="700" text-anchor="start">114,000</text><text x="32" y="505" font-size="22" fill="#53657c" font-weight="400" text-anchor="start">0</text><text x="512" y="505" font-size="22" fill="#53657c" font-weight="400" text-anchor="end">120,000 AED</text><text x="32" y="553" font-size="22" fill="#162235" font-weight="400" text-anchor="start">Rent only / Costs &amp; payment schedules excluded</text><text x="32" y="588" font-size="23" fill="#53657c" font-weight="400" text-anchor="start">Not transactions · SignedPrice calculation</text></g></svg>
